# Labels and comments on new pull requests by a checklist. Every label and comment asks; it can merge, close or push nothing.
version: 1
model: claude-sonnet-5
auth: api_key
browser: none
requires: []
secrets: []

mcp:
  github:
    catalog: github

routines:
  - name: triage-three-times-a-day
    cron: "15 9,12,15 * * 1-5"
    timezone: Europe/Prague
    prompt: Triage the pull requests opened or updated since the last run following the triage skill, then update memory/progress.md.

budget:
  per_run_usd: 0.25
  per_day_usd: 1.5

# Precedence: deny, then require, then allow. Unlisted tools ask.
policy:
  approvals:
    deny:
      # No shell: the shell is the only way to push.
      - Bash
      - mcp__github__merge_*
      - mcp__github__delete_*
      - mcp__github__push_*
      # Closing, editing and re-basing a pull request go through update_pull_request*.
      - mcp__github__update_pull_request*
      # This bot creates nothing: no issues, pull requests, branches, files or reviews.
      - mcp__github__create_*
      - mcp__github__submit_*
      - mcp__github__pull_request_review_write
    require:
      - Write
      - Edit
      - WebFetch
      # The labels (update_issue, issue_write) and the comment (add_issue_comment); a missing label (label_write).
      - mcp__github__add_*
      - mcp__github__update_issue
      - mcp__github__issue_write
      - mcp__github__label_write
    allow:
      - Read
      - Glob
      - Grep
      - ToolSearch
      - mcp__github__get_*
      - mcp__github__list_*
      - mcp__github__search_*
      - mcp__github__issue_read
      - mcp__github__pull_request_read
