version: "3"

vars:
  GIT_SHA:
    sh: git -C {{.ROOT_DIR}} rev-parse --short HEAD 2>/dev/null || echo dev

tasks:
  verify:
    desc: Gate — typecheck, lint and tests; the exit code is the verdict
    cmds:
      - pnpm install --frozen-lockfile --prefer-offline
      - pnpm verify

  check:
    desc: Alias of verify
    cmds:
      - task: verify

  dev:
    desc: Build and start the local stack, wait until it is healthy
    env:
      GIT_SHA: "{{.GIT_SHA}}"
    cmds:
      - docker compose up -d --build --wait

  stop:
    desc: Stop the local stack (keeps data)
    cmds:
      - docker compose down

  reset:
    desc: Stop the local stack and wipe its data
    cmds:
      - docker compose down -v

  logs:
    desc: Tail the stack
    cmds:
      - docker compose logs -f --tail=100
